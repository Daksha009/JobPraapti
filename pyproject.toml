[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.3.0"
description = "Configurable job discovery and application assistant"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.40,<2", "beautifulsoup4>=4.12,<5", "lxml>=5,<7",
  "httpx>=0.27,<1", "pdfplumber>=0.11,<1", "google-genai>=1,<2",
  "flask>=3,<4", "waitress>=3,<4", "schedule>=1.2,<2", "pyyaml>=6,<7",
  "python-dotenv>=1,<2", "click>=8.1,<9", "rich>=13,<15",
  "python-dateutil>=2.9,<3", "filelock>=3.13,<4", "pytz>=2024.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
jobpilot = "jobpilot.__main__:cli"

[tool.setuptools.packages.find]
include = ["jobpilot*"]

[tool.setuptools.package-data]
"jobpilot.dashboard" = ["templates/*.html", "static/css/*.css", "static/js/*.js", "web/index.html", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
